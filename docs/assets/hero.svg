<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">DSH Remote Workspace &amp; Deployment Agent</title>
  <desc id="desc">Product overview showing Local Workspace, SSH Files and Terminal, and the deployment lifecycle from Bootstrap to Runbook, Automation, Verify and Rollback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#2f81f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="480" rx="28" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="432" rx="22" fill="none" stroke="#30363d"/>

  <text x="70" y="86" fill="#f0f6fc" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="34" font-weight="700">DSH Remote Workspace &amp; Deployment Agent</text>
  <text x="70" y="120" fill="#8b949e" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17">Remote SSH workspace • zero-to-one deployment • reviewable Runbook • automation • closed-loop recovery</text>

  <g filter="url(#shadow)">
    <rect x="70" y="165" width="285" height="215" rx="18" fill="#161b22" stroke="#30363d"/>
    <rect x="458" y="165" width="285" height="215" rx="18" fill="#161b22" stroke="#30363d"/>
    <rect x="845" y="165" width="285" height="215" rx="18" fill="#161b22" stroke="#30363d"/>
  </g>

  <text x="95" y="205" fill="#f0f6fc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="19" font-weight="700">LOCAL WORKSPACE</text>
  <text x="95" y="238" fill="#8b949e" font-family="ui-sans-serif,system-ui" font-size="16">Git / source / build / artifact</text>
  <rect x="95" y="267" width="232" height="34" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="109" y="289" fill="#7ee787" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">git diff  →  change set</text>
  <rect x="95" y="315" width="232" height="34" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="109" y="337" fill="#79c0ff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">artifact  →  transfer</text>

  <text x="483" y="205" fill="#f0f6fc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="19" font-weight="700">REMOTE SSH</text>
  <text x="483" y="238" fill="#8b949e" font-family="ui-sans-serif,system-ui" font-size="16">Files / Editor / Terminal / SFTP</text>
  <rect x="483" y="267" width="232" height="34" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="497" y="289" fill="#d2a8ff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">session-bound target</text>
  <rect x="483" y="315" width="232" height="34" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="497" y="337" fill="#ffa657" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">logs / ports / health</text>

  <text x="870" y="205" fill="#f0f6fc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="19" font-weight="700">DEPLOYMENT AGENT</text>
  <text x="870" y="238" fill="#8b949e" font-family="ui-sans-serif,system-ui" font-size="16">Bootstrap → Runbook → Automation</text>
  <rect x="870" y="267" width="232" height="34" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="884" y="289" fill="#7ee787" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">verify → focused UAT</text>
  <rect x="870" y="315" width="232" height="34" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="884" y="337" fill="#ff7b72" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">diagnose → rollback</text>

  <path d="M355 273 C400 273 410 273 458 273" fill="none" stroke="url(#accent)" stroke-width="4"/>
  <path d="M743 273 C790 273 800 273 845 273" fill="none" stroke="url(#accent)" stroke-width="4"/>
  <circle cx="405" cy="273" r="6" fill="#7c5cff"/>
  <circle cx="795" cy="273" r="6" fill="#2f81f7"/>

  <rect x="70" y="405" width="1060" height="2" fill="#30363d"/>
  <text x="70" y="435" fill="#8b949e" font-family="ui-sans-serif,system-ui" font-size="15">One plugin • one SSH source of truth • one conversation target • human-readable operations first</text>
</svg>
